name: sts-swing-ranking-v1

services:
  scheduler:
    image: ${STS_IMAGE:-sts-swing-ranking-v1:local}
    command: ["python", "scripts/run_swing_forward_daemon.py"]
    user: "${STS_UID:-1000}:${STS_GID:-1000}"
    restart: unless-stopped
    env_file:
      - path: ${STS_ROOT:-.}/.env
        required: false
    environment:
      STS_FORWARD_INTERVAL_SECONDS: "${STS_FORWARD_INTERVAL_SECONDS:-3600}"
      STS_RCLONE_REMOTE: "${STS_RCLONE_REMOTE:-gdrive:}"
      RCLONE_CONFIG: /app/secrets/rclone.conf
    volumes: &writer_volumes
      - ${STS_ROOT:-.}/configs:/app/configs
      - ${STS_ROOT:-.}/cache:/app/cache
      - ${STS_ROOT:-.}/runs:/app/runs
      - ${STS_ROOT:-.}/logs:/app/logs
      - ${STS_ROOT:-.}/secrets:/app/secrets

  forward-once:
    image: ${STS_IMAGE:-sts-swing-ranking-v1:local}
    command: ["python", "scripts/run_swing_forward_daily.py"]
    user: "${STS_UID:-1000}:${STS_GID:-1000}"
    profiles: ["manual"]
    env_file:
      - path: ${STS_ROOT:-.}/.env
        required: false
    environment:
      STS_RCLONE_REMOTE: "${STS_RCLONE_REMOTE:-gdrive:}"
      RCLONE_CONFIG: /app/secrets/rclone.conf
    volumes: *writer_volumes

  # Read-only dashboard over the forward ledger and the pushed backtests. It
  # mounts runs/ and configs/ read-only; the scheduler stays the single writer.
  # logs/ is writable only for the authentication audit trail.
  dashboard:
    image: ${STS_IMAGE:-sts-swing-ranking-v1:local}
    command: ["python", "scripts/run_swing_dashboard.py"]
    user: "${STS_UID:-1000}:${STS_GID:-1000}"
    restart: unless-stopped
    env_file:
      - path: ${STS_ROOT:-.}/.env
        required: false
    environment:
      STS_RUNS_ROOT: /app/runs
      STS_REPO_ROOT: /app
      STS_LEGACY_ROOT: /app/legacy
      DASHBOARD_PORT: "8010"
      # Only deploy_local.sh sets this to 1; without it the app refuses to
      # start unless DASHBOARD_SECRET is present, which deploy.sh guarantees.
      DASHBOARD_DEV: "${DASHBOARD_DEV:-}"
      STS_LEGACY_ADMIN_URL: "${STS_LEGACY_ADMIN_URL:-http://legacy-admin:8020}"
      LEGACY_ADMIN_TOKEN: "${LEGACY_ADMIN_TOKEN:-}"
    ports:
      - "127.0.0.1:${STS_DASHBOARD_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 5s
    volumes:
      - ${STS_ROOT:-.}/runs:/app/runs:ro
      - ${STS_ROOT:-.}/configs:/app/configs:ro
      - ${STS_ROOT:-.}/logs:/app/logs
      - ${STS_LEGACY_ROOT:-./legacy-data}/ledger:/app/legacy/ledger:ro
      - ${STS_LEGACY_ROOT:-./legacy-data}/runs:/app/legacy/runs:ro
      - ${STS_LEGACY_ROOT:-./legacy-data}/runs-summary:/app/legacy/runs-summary:ro
      - ${STS_LEGACY_ROOT:-./legacy-data}/logs:/app/legacy/logs:ro
      - ${STS_LEGACY_ROOT:-./legacy-data}/configs:/app/legacy/configs:ro
      - ${STS_LEGACY_ROOT:-./legacy-data}/universe.yaml:/app/legacy/universe.yaml:ro
      - ${STS_ROOT:-.}/legacy-env.redacted:/app/legacy/.env:ro

  # Bounded mutation boundary. This runs in the retained legacy image so the
  # fixed forward_sync.py command remains available. It has no host port and
  # accepts only token-authenticated config/sync requests from the dashboard.
  legacy-admin:
    image: ${STS_LEGACY_IMAGE:-us-central1-docker.pkg.dev/stocks-that-move/sts/sts:latest}
    command: ["python", "/runner/run_legacy_admin_runner.py"]
    user: "${STS_UID:-1000}:${STS_GID:-1000}"
    restart: unless-stopped
    profiles: ["legacy-admin"]
    env_file:
      - path: ${STS_LEGACY_ROOT:-./legacy-data}/.env
        required: false
    environment:
      LEGACY_ADMIN_TOKEN: "${LEGACY_ADMIN_TOKEN:-}"
      RCLONE_CONFIG: /app/secrets/rclone.conf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/healthz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 5s
    volumes:
      - ${STS_LEGACY_ADMIN_RUNNER:-./scripts/run_legacy_admin_runner.py}:/runner/run_legacy_admin_runner.py:ro
      - ${STS_LEGACY_ROOT:-./legacy-data}/ledger:/app/ledger
      - ${STS_LEGACY_ROOT:-./legacy-data}/cache:/app/cache
      - ${STS_LEGACY_ROOT:-./legacy-data}/logs:/app/logs
      - ${STS_LEGACY_ROOT:-./legacy-data}/runs:/app/runs
      - ${STS_LEGACY_ROOT:-./legacy-data}/configs:/app/configs
      - ${STS_LEGACY_ROOT:-./legacy-data}/runs-summary:/app/runs-summary:ro
      - ${STS_LEGACY_ROOT:-./legacy-data}/.env:/app/.env:ro
      - ${STS_LEGACY_ROOT:-./legacy-data}/secrets:/app/secrets:ro
      - ${STS_LEGACY_ROOT:-./legacy-data}/docs:/app/docs:ro
