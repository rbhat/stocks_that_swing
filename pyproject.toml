[project]
name = "sts"
version = "0.1.0"
description = "Stocks That Swing - swing-trading (3-21 session) study and paper-trading engine"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "PyYAML>=6.0",
    "exchange-calendars>=4.5",
    "tenacity>=8.3",
    "curl-cffi>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
ml = [
    "lightgbm>=4.6,<5",
    "scikit-learn>=1.7,<2",
]
dashboard = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "authlib>=1.3",
    "httpx>=0.27",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
